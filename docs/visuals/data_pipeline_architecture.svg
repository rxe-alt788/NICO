<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <rect width="1600" height="900" fill="#fff"/>
  <style>
    .title{font:700 38px Arial,sans-serif;fill:#111}.sub{font:20px Arial,sans-serif;fill:#444}.h{font:700 22px Arial,sans-serif;fill:#111}.t{font:17px Arial,sans-serif;fill:#222}.s{font:15px Arial,sans-serif;fill:#555}.box{fill:#fafafa;stroke:#bdbdbd;stroke-width:2}.obs{fill:#eef7ff;stroke:#7aa7c7;stroke-width:2}.syn{fill:#fff3e3;stroke:#c6924c;stroke-width:2}.core{fill:#f4f4f4;stroke:#666;stroke-width:2}.out{fill:#eef8ef;stroke:#78a77e;stroke-width:2}.arrow{stroke:#555;stroke-width:3;fill:none;marker-end:url(#m)}
  </style>
  <defs><marker id="m" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#555"/></marker></defs>
  <text x="70" y="62" class="title">4NICO data pipeline architecture</text>
  <text x="70" y="98" class="sub">Observed and synthetic lineage stays visible from source to validation output.</text>

  <text x="90" y="155" class="h">Sources</text>
  <rect x="70" y="185" width="300" height="82" rx="12" class="obs"/><text x="95" y="220" class="h">BOM rainfall</text><text x="95" y="247" class="t">Observed Phase 1: station 066214</text>
  <rect x="70" y="287" width="300" height="82" rx="12" class="syn"/><text x="95" y="322" class="h">WaterNSW</text><text x="95" y="349" class="t">Synthetic until Phase 2</text>
  <rect x="70" y="389" width="300" height="82" rx="12" class="syn"/><text x="95" y="424" class="h">IMOS</text><text x="95" y="451" class="t">Synthetic until Phase 3</text>
  <rect x="70" y="491" width="300" height="82" rx="12" class="syn"/><text x="95" y="526" class="h">Beachwatch</text><text x="95" y="553" class="t">Synthetic in completed baseline</text>
  <rect x="70" y="593" width="300" height="100" rx="12" class="obs"/><text x="95" y="628" class="h">ASID / DPI incidents</text><text x="95" y="655" class="t">Authoritative + verified interim</text><text x="95" y="680" class="s">Unverified supplementary excluded</text>

  <path d="M370 430 L470 430" class="arrow"/>
  <text x="500" y="155" class="h">Ingestion + lineage</text>
  <rect x="470" y="185" width="390" height="508" rx="16" class="box"/>
  <text x="500" y="225" class="h">Source adapters</text><text x="500" y="255" class="t">Normalize timestamps and fields</text>
  <line x1="500" y1="280" x2="830" y2="280" stroke="#ddd"/>
  <text x="500" y="320" class="h">Provenance enforcement</text><text x="500" y="350" class="t">ASID_AUTHORITATIVE</text><text x="500" y="378" class="t">VERIFIED_INTERIM</text><text x="500" y="406" class="t">UNVERIFIED_SUPPLEMENTARY</text>
  <line x1="500" y1="430" x2="830" y2="430" stroke="#ddd"/>
  <text x="500" y="470" class="h">Synthetic flag preservation</text><text x="500" y="500" class="t">Synthetic rows remain quarantined</text><text x="500" y="528" class="t">from empirical performance claims</text>
  <line x1="500" y1="552" x2="830" y2="552" stroke="#ddd"/>
  <text x="500" y="592" class="h">Missing-data rule</text><text x="500" y="622" class="t">No silent zeros, no silent GREEN</text><text x="500" y="650" class="t">Missing core data → BLACKOUT</text>

  <path d="M860 430 L960 430" class="arrow"/>
  <text x="990" y="155" class="h">Frozen decision layer</text>
  <rect x="960" y="185" width="280" height="230" rx="16" class="core"/>
  <text x="990" y="225" class="h">Rules engine</text><text x="990" y="258" class="t">Environmental score</text><text x="990" y="288" class="t">Observation confidence</text><text x="990" y="318" class="t">Immediate escalation</text><text x="990" y="348" class="t">24h de-escalation hold</text><text x="990" y="383" class="s">Frozen during displacement</text>

  <path d="M1240 300 L1320 300" class="arrow"/>
  <text x="1325" y="155" class="h">Outputs</text>
  <rect x="1300" y="185" width="250" height="230" rx="16" class="out"/>
  <text x="1325" y="225" class="h">Operational state</text><text x="1325" y="258" class="t">GREEN / ORANGE / RED</text><text x="1325" y="288" class="t">HIGH / MODERATE /</text><text x="1325" y="313" class="t">BLACKOUT</text><text x="1325" y="350" class="h">Metrics</text><text x="1325" y="380" class="t">Alert Occupancy</text><text x="1325" y="405" class="t">Transitions / month</text>

  <rect x="960" y="500" width="590" height="193" rx="16" fill="#f7f7fb" stroke="#9d9db4" stroke-width="2"/>
  <text x="990" y="540" class="h">CI/CD validation loop</text><text x="990" y="575" class="t">GitHub Actions → fetch/generate ephemeral raw inputs</text><text x="990" y="607" class="t">→ run ingestion + validation → preserve raw inputs as artifact</text><text x="990" y="639" class="t">→ bot commit processed series + validation report only</text><text x="990" y="672" class="s">Raw data does not become branch state.</text>

  <path d="M1300 500 C1280 455 1215 450 1170 415" class="arrow"/>

  <rect x="70" y="760" width="1480" height="78" rx="12" fill="#111"/>
  <text x="100" y="795" style="font:700 21px Arial,sans-serif;fill:#fff">Phase posture:</text><text x="270" y="795" style="font:19px Arial,sans-serif;fill:#fff">Phase 0 synthetic baseline complete → Phase 1 displaces rainfall with observed BOM data.</text>
  <text x="100" y="823" style="font:17px Arial,sans-serif;fill:#ddd">The validation machine is complete. The validated shark-risk model is not yet.</text>
</svg>