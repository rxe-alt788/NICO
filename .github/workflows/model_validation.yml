name: 4NICO model validation

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/bootstrap_raw_data.py'
      - 'scripts/fetch_bom_cdo.py'
      - 'scripts/ingest_historical.py'
      - 'scripts/run_validation.py'
      - 'scripts/adapters/**'
      - 'requirements-validation.txt'
      - 'data/incidents_interim.json'
      - '.github/workflows/model_validation.yml'
      - '.gitignore'

concurrency:
  group: nico-pipeline
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main tracking branch
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install validation dependencies
        run: python -m pip install -r requirements-validation.txt

      - name: Bootstrap public ASID and engineering fixtures
        run: python scripts/bootstrap_raw_data.py

      - name: Displace synthetic rainfall with observed BOM CDO archive
        env:
          BOM_CDO_STATION: '066214'
        run: python scripts/fetch_bom_cdo.py

      - name: Verify BOM displacement file
        shell: bash
        run: |
          set -euo pipefail
          test -s data/raw/bom_rainfall_history.csv
          echo "BOM file bytes: $(wc -c < data/raw/bom_rainfall_history.csv)"
          echo "BOM file rows: $(( $(wc -l < data/raw/bom_rainfall_history.csv) - 1 ))"
          head -n 3 data/raw/bom_rainfall_history.csv
          if grep -qi ',true,' data/raw/bom_rainfall_history.csv; then
            echo "ERROR: observed BOM displacement contains synthetic rows"
            exit 1
          fi

      - name: Configure ephemeral raw sources
        shell: bash
        run: |
          [ -f data/raw/bom_rainfall_history.csv ] && echo "BOM_ARCHIVE_CSV=data/raw/bom_rainfall_history.csv" >> "$GITHUB_ENV" || true
          [ -f data/raw/waternsw_history.csv ] && echo "WATERNSW_ARCHIVE_CSV=data/raw/waternsw_history.csv" >> "$GITHUB_ENV" || true
          [ -f data/raw/beachwatch_history.csv ] && echo "BEACHWATCH_ARCHIVE_CSV=data/raw/beachwatch_history.csv" >> "$GITHUB_ENV" || true
          [ -f data/raw/imos_sst_history.csv ] && echo "IMOS_ARCHIVE_CSV=data/raw/imos_sst_history.csv" >> "$GITHUB_ENV" || true
          [ -f data/raw/asid_public.xlsx ] && echo "ASID_ARCHIVE_FILE=data/raw/asid_public.xlsx" >> "$GITHUB_ENV" || true

      - name: Run historical ingestion
        env:
          WATERNSW_SUBSCRIPTION_KEY: ${{ secrets.WATERNSW_SUBSCRIPTION_KEY }}
          WATERNSW_ARCHIVE_URL: ${{ secrets.WATERNSW_ARCHIVE_URL }}
          BEACHWATCH_ARCHIVE_URL: ${{ secrets.BEACHWATCH_ARCHIVE_URL }}
          IMOS_ARCHIVE_URL: ${{ secrets.IMOS_ARCHIVE_URL }}
          ASID_ARCHIVE_URL: ${{ secrets.ASID_ARCHIVE_URL }}
        run: python scripts/ingest_historical.py

      - name: Generate validation report
        run: python scripts/run_validation.py

      - name: Diagnose processed output diff
        shell: bash
        run: |
          echo "Tracked processed output status:"
          git status --short -- data/empirical_18m_series.json data/validation_report.md
          echo "Processed output diff summary:"
          git diff --stat -- data/empirical_18m_series.json data/validation_report.md || true
          echo "BOM lineage in processed dataset:"
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('data/empirical_18m_series.json').read_text())
          print(json.dumps(d.get('sourceStatus',{}).get('bom',{}), indent=2))
          PY

      - name: Preserve raw inputs as audit artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nico-raw-inputs-${{ github.run_id }}
          path: data/raw/*
          if-no-files-found: warn
          retention-days: 30

      - name: Commit processed outputs only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "4NICO validation bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/empirical_18m_series.json data/validation_report.md
          if git diff --staged --quiet; then
            echo "No processed validation changes; clean-diff exit is expected."
            exit 0
          fi
          git commit -m "chore(data): re-evaluate 18m empirical series [skip ci]"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
